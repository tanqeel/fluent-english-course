<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speak Fluently — English for Everywhere</title>
<meta name="description" content="Your 90-day path from A2/B1 to B2+ English. Lessons, speaking practice, AI coach, IELTS prep. Fully offline after install.">
<meta name="theme-color" content="#0b0f1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speak Fluently">
<link rel="stylesheet" href="css/styles.css">
<script>
/* pre-paint theme: apply the stored explicit choice before CSS loads.
   System mode needs no attribute — CSS reads the OS preference. */
try{var __t=localStorage.getItem('fluent_theme')||'system';
if(__t!=='system')document.documentElement.setAttribute('data-theme',__t);}catch(e){}
</script>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="logo">S</span><span>Speak&nbsp;Fluently</span></div>
    <div class="hud">
      <span class="pill streak" id="hud-streak">🔥 0</span>
      <span class="pill xp" id="hud-xp">⚡ 0</span>
      <button class="icon-btn" id="theme-toggle" aria-label="Theme: system. Tap to change.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M8 21h8M12 17v4"/></svg>
      </button>
    </div>
  </header>
  <main id="root"><div class="empty" style="margin-top:60px">Loading Speak Fluently… ⚡</div></main>
</div>
<nav class="bottom"><div class="wrap" id="tabbar"></div></nav>
<script src="js/store.js"></script>
<script src="js/sm2.js"></script>
<script src="js/theme.js"></script>
<script src="js/ui.js"></script>
<script src="js/content.js"></script>
<script src="js/drills.js"></script>
<script src="js/screens.js"></script>
<script src="js/aicoach.js"></script>
<script src="js/app.js"></script>
</body>
</html>
